<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, 'Segoe UI', sans-serif">
  <text x="440" y="26" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">JeeLowCode 分层架构与请求生命周期</text>
  <text x="20" y="58" font-size="13" font-weight="700" fill="#0f172a">模块分层（Maven 模块）</text>
  <rect x="20" y="68" width="380" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="35" y="88" font-size="12" font-weight="700" fill="#92400e">jeelowcode-admin</text>
  <text x="35" y="106" font-size="11" fill="#78350f">启动入口 · Application · yml 配置 · 端口 48080</text>
  <text x="35" y="120" font-size="11" fill="#78350f">汇聚所有模块，main() 在此</text>
  <rect x="20" y="132" width="380" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="35" y="152" font-size="12" font-weight="700" fill="#1e40af">jeelowcode-code · 核心模块</text>
  <text x="35" y="170" font-size="11" fill="#1e3a8a">框架"大脑"：表单开发/增强/自定义表单/多模块/报表</text>
  <text x="35" y="184" font-size="11" fill="#1e3a8a">统一 Controller · 元数据解析 · SQL 拼装 · 增强调度</text>
  <rect x="20" y="196" width="380" height="76" rx="6" fill="#dcfce7" stroke="#10b981"/>
  <text x="35" y="216" font-size="12" font-weight="700" fill="#065f46">jeelowcode-framework · 功能模块</text>
  <text x="35" y="234" font-size="11" fill="#064e3b">excel(导入导出) · exception(异常) · plus(SQL/DDL构建)</text>
  <text x="35" y="250" font-size="11" fill="#064e3b">sqlformat(SQL核心) · tenant(租户过滤) · utils(工具)</text>
  <text x="35" y="266" font-size="11" fill="#064e3b">这些是 code 模块的"工具箱"，可被业务模块复用</text>
  <rect x="20" y="280" width="380" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="35" y="300" font-size="12" font-weight="700" fill="#5b21b6">jeelowcode-module · 业务模块</text>
  <text x="35" y="318" font-size="11" fill="#4c1d95">module-api(业务接口) · module-biz(业务实现)</text>
  <text x="35" y="332" font-size="11" fill="#4c1d95">某出行运营企业项目自定义 Controller/Enhance/Mapper 在此层</text>
  <rect x="20" y="344" width="380" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,3"/>
  <text x="35" y="364" font-size="11" fill="#475569">yudao-framework / yudao-module · 芋道 ruoyi-vue-pro 底座</text>
  <text x="35" y="378" font-size="11" fill="#475569">权限/字典/任务/邮件 等基础能力（JeeLowCode 二次封装源）</text>
  <text x="460" y="58" font-size="13" font-weight="700" fill="#0f172a">一次请求的生命周期（以表单分页查询为例）</text>
  <g font-size="11" fill="#0f172a">
    <rect x="460" y="70" width="400" height="34" rx="4" fill="#fff" stroke="#3b82f6"/>
    <text x="475" y="91">① 前端路由 /table/view/{dbform_id} → 加载 dbform 元数据</text>
    <rect x="460" y="120" width="400" height="34" rx="4" fill="#fff" stroke="#3b82f6"/>
    <text x="475" y="141">② POST /jeelowcode/dbform-data/page · 携带分页+查询参数</text>
    <rect x="460" y="170" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="191">③ 框架读 lowcode_dbform + _field + _field_web + _query</text>
    <rect x="460" y="220" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="241">④ Before 增强链 · EnhanceContext.getParam() 可改参数</text>
    <rect x="460" y="270" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="291">⑤ Around 增强 beforeExecute · 可 setPageResult 跳过框架</text>
    <rect x="460" y="320" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="341">⑥ 框架拼装 SQL（含 tenant_id/is_deleted 过滤）→ 执行</text>
    <rect x="460" y="370" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="391">⑦ SQL 增强 · 后置，对 records 二次加工</text>
    <rect x="460" y="420" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="441">⑧ After 增强 · 对 records 再加工（如计算年龄）</text>
    <rect x="460" y="470" width="400" height="34" rx="4" fill="#fff" stroke="#10b981"/>
    <text x="475" y="491">⑨ Throw 增强 · 异常时触发 · 统一返回 ResultDataModel</text>
  </g>
  <text x="20" y="430" font-size="13" font-weight="700" fill="#0f172a">三库架构（@DS 切换）</text>
  <rect x="20" y="440" width="125" height="56" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="82" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">master</text>
  <text x="82" y="476" text-anchor="middle" font-size="10" fill="#713f12">业务数据</text>
  <text x="82" y="490" text-anchor="middle" font-size="10" fill="#713f12">+ system_menu</text>
  <rect x="155" y="440" width="125" height="56" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="217" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">frame</text>
  <text x="217" y="476" text-anchor="middle" font-size="10" fill="#713f12">配置元数据</text>
  <text x="217" y="490" text-anchor="middle" font-size="10" fill="#713f12">lowcode_dbform*</text>
  <rect x="290" y="440" width="125" height="56" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="352" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">log（懒加载）</text>
  <text x="352" y="476" text-anchor="middle" font-size="10" fill="#713f12">API 访问日志</text>
  <text x="352" y="490" text-anchor="middle" font-size="10" fill="#713f12">错误/操作日志</text>
  <text x="20" y="514" font-size="11" fill="#475569">多租户基线：所有业务表含 tenant_id 字段，框架自动注入 WHERE tenant_id = ?</text>
  <text x="20" y="530" font-size="11" fill="#475569">忽略租户：@TenantIgnore 注解 或 在表单开发中标记（doc-20）</text>
  <text x="20" y="546" font-size="11" fill="#475569">软删除基线：所有业务表含 is_deleted 字段，框架自动注入 WHERE is_deleted = 0</text>
</svg>
